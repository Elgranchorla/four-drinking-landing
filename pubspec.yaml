name: four_drinking_landing
description: Public landing page for 4drinking (Flutter Web + Firebase Hosting).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  flutter_svg: ^2.3.2
  flutter_markdown: ^0.7.7+1
  go_router: ^17.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/legal/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
